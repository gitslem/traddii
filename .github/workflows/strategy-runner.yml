name: Strategy runner

# Replays saved strategies' forward tests and sends alerts while nobody has
# Traddii open. GitHub runs schedules on a best-effort basis: runs can start
# late or be skipped when GitHub is busy, and schedules pause after 60 days
# without commits to the repository.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strategy-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check the runner is configured
        id: config
        env:
          RUNNER_KEY: ${{ secrets.FIREBASE_RUNNER_KEY }}
        run: |
          if [ -n "$RUNNER_KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "Not configured: run scripts/setup-strategy-runner.sh"; fi

      - name: Checkout repository
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Replay strategies
        if: steps.config.outputs.ready == 'true'
        run: npx tsx scripts/strategy-runner.ts
        env:
          FIREBASE_RUNNER_KEY: ${{ secrets.FIREBASE_RUNNER_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
